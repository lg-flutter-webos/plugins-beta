name: firebase_remote_config_webos
description: A webOS implementation of the Firebase Remote Config plugin.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_remote_config_platform_interface: any
  plugin_platform_interface: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^17.0.0

flutter:
  plugin:
    platforms:
      webos:
        dartPluginClass: FirebaseRemoteConfigWebos
        pluginClass: FirebaseRemoteConfigWebosPlugin

name: firebase_firestore_webos
description: webOS implementation of the cloud_firestore plugin.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  cloud_firestore_platform_interface: ^6.6.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  pigeon: ^17.0.0

flutter:
  plugin:
    platforms:
      webos:
        dartPluginClass: FirebaseFirestoreWebos
        pluginClass: FirebaseFirestoreWebosPlugin
